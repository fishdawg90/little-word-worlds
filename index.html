<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7e8"><title>Little Word Worlds</title>
<style>body{margin:0;background:#fff7e8;color:#233142;font:18px system-ui}main{max-width:900px;margin:8vh auto;padding:24px}small{font-weight:800;color:#86724a;letter-spacing:.14em}h1{font-size:clamp(40px,8vw,68px);letter-spacing:-.05em;margin:16px 0}p{color:#667085;line-height:1.6}.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:36px}.pack{color:inherit;text-decoration:none;background:white;border-radius:30px;padding:30px;box-shadow:0 8px 24px #23314212;transition:transform .15s}.pack:hover{transform:translateY(-4px)}.emoji{font-size:56px}.pack h2{font-size:26px}.play{display:inline-block;background:#ffb703;color:#312405;padding:12px 22px;border-radius:16px;font-weight:850}footer{margin-top:40px;font-size:13px;color:#667085}a{color:#596b60}</style>
<main><small>LISTEN · LOOK · TAP</small><h1>Little Word Worlds</h1><p>A little discovery, in two languages.<br>Choose a world to explore in English or Italian.</p><div class="packs" id="packs" aria-live="polite">Loading worlds…</div><footer>Made for little hands. Artwork and voices created with AI.<br><a href="downloads/pack-studio.zip">Download Pack Studio for your computer</a></footer></main>
<script>fetch('packs/catalog.json').then(r=>{if(!r.ok)throw Error('Could not load packs');return r.json()}).then(c=>{const root=document.getElementById('packs');root.textContent='';for(const p of c.packs){const a=document.createElement('a');a.className='pack';a.href='game.html?pack='+encodeURIComponent(p.id);const e=document.createElement('div');e.className='emoji';e.textContent=p.emoji||'🌟';const h=document.createElement('h2');h.textContent=p.title.en;const d=document.createElement('p');d.textContent=p.items.length+' words · English & Italiano';const b=document.createElement('span');b.className='play';b.textContent='Let’s play →';a.append(e,h,d,b);root.append(a)}}).catch(e=>document.getElementById('packs').textContent=e.message);</script></html>
